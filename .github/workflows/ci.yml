name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev,deps]"

      - name: Run tests
        run: pytest -q

  self-scan:
    name: XSEC scans itself (dogfood)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e .

      # The examples/ folder is intentionally vulnerable, so ignore it and
      # fail the build only on real HIGH+ findings in our own source.
      - name: Scan source
        run: xsec scan xsec --fail-on HIGH

  extension:
    name: VS Code extension build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & typecheck
        working-directory: vscode-extension
        run: |
          npm install
          npx tsc -p ./ --noEmit
