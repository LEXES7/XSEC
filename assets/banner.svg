<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none" role="img" aria-label="XSEC - vulnerability scanner and auto-fixer for AI-written code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#11151f"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>

    <!-- faint grid -->
    <g stroke="#1e2636" stroke-width="1">
      <path d="M0 64H1280M0 128H1280M0 192H1280M0 256H1280"/>
      <path d="M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
    </g>

    <!-- drifting code glyphs (the kind of thing XSEC flags) -->
    <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#243044">
      <text x="70" y="250">eval(user_input)</text>
      <text x="930" y="92">shell=True</text>
      <text x="1000" y="280">md5(pw)</text>
      <text x="80" y="96">pickle.loads(blob)</text>
      <text x="540" y="40">verify=False</text>
      <text x="560" y="300">sk_live_••••</text>
    </g>

    <!-- moving vertical scan beam -->
    <rect x="0" y="0" width="120" height="320" fill="url(#scan)">
      <animate attributeName="x" values="-120;1280" dur="4.2s" begin="0s" repeatCount="indefinite"/>
    </rect>

    <!-- shield emblem -->
    <g transform="translate(96 86)">
      <path d="M74 0 L138 30 L138 80 Q138 140 74 168 Q10 140 10 80 L10 30 Z" fill="url(#brand)" opacity="0.18"/>
      <path d="M74 0 L138 30 L138 80 Q138 140 74 168 Q10 140 10 80 L10 30 Z" fill="none" stroke="url(#brand)" stroke-width="3"/>
      <!-- X mark -->
      <g stroke="#e5e7eb" stroke-width="11" stroke-linecap="round">
        <line x1="50" y1="58" x2="98" y2="106"/>
        <line x1="98" y1="58" x2="50" y2="106"/>
      </g>
      <circle cx="74" cy="82" r="7" fill="#06b6d4">
        <animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- wordmark + tagline -->
    <g transform="translate(300 0)">
      <text x="0" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="6" fill="#f8fafc">XSEC</text>
      <text x="4" y="196" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#94a3b8">vulnerability scanner + auto-fixer for AI-written code</text>

      <!-- terminal line with blinking cursor -->
      <g transform="translate(4 232)">
        <text x="0" y="20" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#22d3ee">$</text>
        <text x="22" y="20" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#cbd5e1">xsec scan .</text>
        <rect x="158" y="4" width="11" height="20" fill="#22d3ee">
          <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
        </rect>
        <text x="190" y="20" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#34d399" opacity="0">
          8 findings - 3 fixed
          <animate attributeName="opacity" values="0;0;1;1" dur="4.2s" repeatCount="indefinite"/>
        </text>
      </g>
    </g>

    <!-- language chips -->
    <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#9fb0c3">
      <g transform="translate(960 130)">
        <rect width="76" height="28" rx="14" fill="#0e1622" stroke="#243044"/>
        <text x="38" y="19" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(1046 130)">
        <rect width="58" height="28" rx="14" fill="#0e1622" stroke="#243044"/>
        <text x="29" y="19" text-anchor="middle">JS/TS</text>
      </g>
      <g transform="translate(1114 130)">
        <rect width="56" height="28" rx="14" fill="#0e1622" stroke="#243044"/>
        <text x="28" y="19" text-anchor="middle">Java</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="none" stroke="#1f2937"/>
  </g>
</svg>
