[project]
name = "xsec"
version = "0.1.0"
description = "Vulnerability scanner and auto-fixer for AI-written code (Python/JS/TS/Java SAST, AI review via Claude or free Groq/OpenRouter, dependency CVE scan)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",  # tomllib backport for Python 3.10
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
deps = ["certifi>=2023.0"]
secure = ["keyring>=24.0"]
treesitter = [
    "tree-sitter>=0.22",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-java>=0.21",
]
dev = ["pytest>=8.0", "keyring>=24.0"]

[project.scripts]
xsec = "xsec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xsec*"]
