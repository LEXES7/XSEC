name: "XSEC security scan"
description: "Scan a repository for vulnerabilities in AI-written code and (optionally) upload SARIF to GitHub code scanning."
author: "XSEC"
branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "File or directory to scan."
    required: false
    default: "."
  fail-on:
    description: "Fail the job if any finding is at or above this severity (INFO/LOW/MEDIUM/HIGH/CRITICAL). Empty disables gating."
    required: false
    default: "HIGH"
  min-severity:
    description: "Hide findings below this severity."
    required: false
    default: "LOW"
  deps:
    description: "Also scan dependencies for known CVEs (true/false)."
    required: false
    default: "false"
  sarif-file:
    description: "Write SARIF output to this path (for upload to code scanning). Empty disables."
    required: false
    default: "xsec.sarif"
  extras:
    description: "pip extras to install, e.g. 'treesitter,deps'."
    required: false
    default: "treesitter,deps"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install XSEC
      shell: bash
      run: pip install "xsec[${{ inputs.extras }}] @ git+https://github.com/LEXES7/XSEC.git"

    - name: Run scan
      shell: bash
      run: |
        args=(scan "${{ inputs.path }}" --min-severity "${{ inputs.min-severity }}")
        if [ "${{ inputs.deps }}" = "true" ]; then args+=(--deps); fi
        if [ -n "${{ inputs.sarif-file }}" ]; then
          xsec "${args[@]}" --sarif > "${{ inputs.sarif-file }}"
        fi
        # human-readable run that also applies the fail-on gate
        gate=()
        if [ -n "${{ inputs.fail-on }}" ]; then gate=(--fail-on "${{ inputs.fail-on }}"); fi
        xsec "${args[@]}" "${gate[@]}"

    - name: Upload SARIF to code scanning
      if: ${{ inputs.sarif-file != '' && always() }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: xsec
